name: skypagos
description: "Portal de pedidos ORAL-PLUS"
publish_to: "none"

version: 1.0.11+12

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP y utilidades
  http: ^1.1.0
  cupertino_icons: ^1.0.2
  intl: ^0.20.2

  permission_handler: ^12.0.1

  # Cámara / galería para evidencias de pago
  image_picker: ^1.1.2

  # Comprobante de pedido (PDF)
  pdf: ^3.10.7
  path_provider: ^2.1.2
  open_file: ^3.3.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  provider: ^6.1.5+1
  shared_preferences: ^2.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/Oral-plus-logo.png
    - assets/Logo-pagos.png
    - assets/ENCABEZADOS/Icon-512.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/ENCABEZADOS/Icon-512.png"
